[project]
name = "agendev"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alpha-vantage>=3.0.0",
    "boto3>=1.34.0",
    "strands-agents>=1.65.0",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-agentcore]>=1.44.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
